[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.2.8"
description = "CLI-first local Agentic RAG system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
agentic = [
    "langgraph>=0.2.0",
]
visual = [
    "pymupdf>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rag = "agentic_rag.cli:app"
rag-api = "agentic_rag.server.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
